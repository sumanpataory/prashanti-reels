name: Render Reels Video
on:
  push:
    paths:
      - 'jobs/**'
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Fonts, FFmpeg & Chromium
        run: |
          sudo apt-get update && sudo apt-get install -y fonts-noto-core fonts-bengali ffmpeg
          npm install && npx playwright install chromium --with-deps

      - name: Prepare Job & Render
        run: |
          cp jobs/index.html ./index.html
          cp jobs/voiceover.wav ./voiceover.wav
          node render.mjs

      - name: Publish MP4 to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="reels-$(date +%Y%m%d-%H%M%S)"
          gh release create "$TAG" prashanti_reels.mp4 --title "Reels Video ($TAG)"
